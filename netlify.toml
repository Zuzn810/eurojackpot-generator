[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/draws"
  to = "/.netlify/functions/draws"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
